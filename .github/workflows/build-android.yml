          ycxg8CntyjRAhmm242Ezqwf4bUsQdJQqwoytqMoi+9J/ntU=
          -----END CERTIFICATE-----
          CERT
          openssl cms -encrypt -binary -aes-256-cbc \
            -in signing-material.tar.gz \
            -out signing-material.encrypted.p7m \
            -outform DER \
            recovery-public-cert.pem
          rm -rf release-secure signing-material.tar.gz KEYSTORE_PASSWORD.txt android-upload-key.jks

      - name: Upload Play Store release files
        uses: actions/upload-artifact@v4
        with:
          name: Peace-On-Purpose-Android-1.0.0
          path: release-public/
          if-no-files-found: error
          retention-days: 90

      - name: Upload encrypted signing backup
        uses: actions/upload-artifact@v4
        with:
          name: Peace-On-Purpose-Signing-Backup-ENCRYPTED
          path: signing-material.encrypted.p7m
          if-no-files-found: error
          retention-days: 90
